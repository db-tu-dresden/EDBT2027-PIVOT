# ptr[i] = v[i]
primitive: STOREU
input: [ptr, v]
output:
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_storeu_{dtype_suffix}(ptr, v);'

  - isa: arm
    direct: 'vst1{neon_widths}_{dtype_suffix}(ptr, v);'

  - isa: arm
    direct: 'svst1_{dtype_suffix}(svptrue_b{elem_bits}(), ptr, v);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {ptr: 'void*', v: '{v}'}
    direct: '__builtin_memcpy(ptr, &v, sizeof(v));'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {ptr: 'void*', v: '{v}'}
    direct: 'tsl::store<{simd_v}, false>((typename {simd_v}::base_type*)ptr, v);'

---
# if k[i]: ptr[i] = v[i]
primitive: STOREU_MASKED
input: [ptr, k, v]
output:
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_storeu_{dtype_suffix}(ptr, k, v);'

  - isa: arm
    direct: 'svst1_{dtype_suffix}(k, ptr, v);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {ptr: 'void*', k: '{vbool}', v: '{v}'}
    direct: '__builtin_masked_store(k, v, ({s}*)ptr);'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {ptr: 'void*', k: '{vbool}', v: '{v}'}
    direct: 'tsl::store_mask<{simd_v}, false>(k, (typename {simd_v}::base_type*)ptr, v);'
