primitive: VGEQ
input: [a, b]
output: res
definitions:
  # x86 - mask return type
  - 'isa': 'x86'
    'dtype': '{int, uint}'
    'direct': '_mm{x86_widths}_cmpge_{dtype_suffix}_mask(a, b);'

  - isa: x86
    dtype: 'float'
    direct: '_mm512_cmp_{dtype_suffix}_mask(a, b, _CMP_GE_OQ);'

  # x86 - vector return type
  - 'isa': 'x86'
    'dtype': 'float'
    'direct': '_mm_cmpge_{dtype_suffix}(a, b);'

  # Clang builtins - mask return type
  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a >= b;'

  # Clang builtins - vector return type
  - isa: clang_builtins
    dtype: '{int, uint}'
    signature: { a: '{v}', b: '{v}', res: '{v}' }
    direct: '({v})(a >= b);'

  # core_simd — SimdPartialOrd -> Mask
  - isa: core_simd
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a.simd_ge(b);'
