# res[i] = data[indexes[i]]
primitive: PERMUTE
input: [data, indexes]
output: res
definitions:
  - isa: arm
    direct: 'svtbl_s32(data, svreinterpret_u32_s32(indexes));'
  - isa: arm
    direct: 'svtbl_f64(data, svreinterpret_u64_s64(indexes));'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {data: '{v}', indexes: '{vint}', res: '{v}'}
    direct:
      - '{v} _r;'
      - 'int _n = sizeof({v}) / sizeof({s});'
      - 'for (int _i = 0; _i < _n; _i++) { long _ix = indexes[_i]; _r[_i] = (_ix >= 0 && _ix < _n) ? data[_ix] : 0; }'
      - 'return _r;'

  - isa: tsl
    dtype: '{int}'
    signature: {data: '{v}', indexes: '{v}', res: '{v}'}
    direct: 'tsl::permute_lanes<{simd_data}, {simd_indexes}>(data, indexes);'

  - isa: tsl
    signature: {data: vd, indexes: vl, res: vd}
    direct: 'tsl::permute_lanes<{simd_data}, {simd_indexes}>(data, indexes);'

