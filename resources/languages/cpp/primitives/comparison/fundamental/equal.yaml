# res = a == b
primitive: EQ
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_cmpeq_{dtype_suffix}_mask(a, b);'

  - isa: x86
    dtype: float
    direct: '_mm{x86_widths}_cmp_{dtype_suffix}_mask(a, b, _CMP_EQ_OQ);'

  - isa: arm
    direct: 'vceq{neon_widths}_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'svcmpeq_{dtype_suffix}(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a == b;'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'tsl::equal<{simd_a}>(a, b);'

---
# res = k ? (a == b) : 0
primitive: EQ_ZERO
input: [k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_cmpeq_{dtype_suffix}_mask(k, a, b);'

  - isa: x86
    dtype: float
    direct: '_mm{x86_widths}_mask_cmp_{dtype_suffix}_mask(k, a, b, _CMP_EQ_OQ);'

  - isa: arm
    direct: 'svcmpeq_{dtype_suffix}(k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'k ? (a == b) : false;'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'tsl::equal_maskz<{simd_a}>(k, a, b);'

---
# res[i] = (a[i] == b[i]) ? all-ones : 0
primitive: EQ_VEC
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_cmpeq_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'vceq{neon_widths}_{dtype_suffix}(a, b);'

  - isa: clang_builtins
    dtype: '{int, uint}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: '({v})(a == b);'

  - isa: tsl
    dtype: '{int, uint}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::to_vector<{simd_res}>(tsl::equal<{simd_res}>(a, b));'
