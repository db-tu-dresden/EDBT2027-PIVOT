# res = a + b
primitive: VADD
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_add_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'vadd{neon_widths}_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'svadd_{dtype_suffix}_{sve_gov}(svptrue_b{elem_bits}(), a, b);'

  # scalar-broadcast form: b is a scalar added to every lane
  - isa: arm
    direct: 'svadd_n_{dtype_suffix}_{sve_gov}(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a + b;'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{s}', res: '{v}'}
    direct: 'a + ({v})(b);'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::add<{simd_res}>(a, b);'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{s}', res: '{v}'}
    direct: 'tsl::add<{simd_res}>(a, tsl::set1<{simd_res}>(b));'

---
# res = k ? a + b : src
primitive: VADD_MERGE
input: [src, k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_add_{dtype_suffix}(src, k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'k ? (a + b) : src;'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::select<{simd_res}>(k, tsl::add<{simd_res}>(a, b), src);'

---
# res = k ? a + b : 0
primitive: VADD_ZERO
input: [k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_maskz_add_{dtype_suffix}(k, a, b);'

  - isa: arm
    direct: 'svadd_{dtype_suffix}_z(k, a, b);'

  - isa: arm
    direct: 'svadd_n_{dtype_suffix}_z(k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'k ? (a + b) : ({v}){0};'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{s}', res: '{v}'}
    direct: 'k ? (a + ({v})(b)) : ({v}){0};'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::add_maskz<{simd_res}>(k, a, b);'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{s}', res: '{v}'}
    direct: 'tsl::add_maskz<{simd_res}>(k, a, tsl::set1<{simd_res}>(b));'
