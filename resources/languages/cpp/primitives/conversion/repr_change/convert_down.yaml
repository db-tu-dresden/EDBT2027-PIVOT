      for (int _i = 0; _i < 4; _i++) { long long _v = data[_i]; __r[_i] = _v < -128 ? -128 : (_v > 127 ? 127 : _v); }
      return __r;
  - isa: clang_builtins
    signature: {data: 'v4i', res: 'v8s'}
    direct: |-
      v8s __r = {0};
      for (int _i = 0; _i < 4; _i++) { long long _v = data[_i]; __r[_i] = _v < -32768 ? -32768 : (_v > 32767 ? 32767 : _v); }
      return __r;
  - isa: clang_builtins
    signature: {data: 'v8i', res: 'v16c'}
    direct: |-
      v16c __r = {0};
      for (int _i = 0; _i < 8; _i++) { long long _v = data[_i]; __r[_i] = _v < -128 ? -128 : (_v > 127 ? 127 : _v); }
      return __r;
  - isa: clang_builtins
