primitive: CAST_PS_SI512
input: [a]   # res := reinterpret float32 register as 512-bit integer
output: res
definitions:

  # x86
  - isa: x86
    direct: '_mm512_castps_si512(a);'

  # Clang
  - isa: clang_builtins
    signature: {a: v16f, res: v16i}
    direct: '(v16i)a;'

  # core_simd — same-size bit reinterpret
  - isa: core_simd
    signature: {a: v16f, res: v16i}
    direct: 'unsafe { core::mem::transmute::<{simd_a}, {simd_res}>(a) };'
