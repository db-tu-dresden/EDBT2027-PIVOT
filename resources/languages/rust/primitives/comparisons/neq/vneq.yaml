primitive: VNEQ
input: [a, b]
output: res
definitions:
  - isa: x86
    dtype: 'float'
    direct: _mm_cmpneq_{dtype_suffix}(a, b);

  - isa: x86
    dtype: '{int, uint}'
    direct: _mm256_cmpneq_{dtype_suffix}_mask(a, b);

  - isa: x86
    dtype: '{int, uint, float}'
    direct: _mm512_cmpneq_{dtype_suffix}_mask(a, b);

  - isa: x86
    dtype: 'float'
    direct: '_mm512_cmp_{dtype_suffix}_mask(a, b, _CMP_NEQ_OQ);'

  - isa: x86
    dtype: '{int, uint}'
    direct: _mm_cmpneq_{dtype_suffix}_mask(a, b);

  - isa: arm
    dtype: '{int, uint, float}'
    direct: 'svcmpne_{dtype_suffix}(svptrue_b{elem_bits}(), a, b);'

  # Clang builtins - returns bool vector
  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a != b;'

  # core_simd — SimdPartialEq -> Mask
  - isa: core_simd
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a.simd_ne(b);'
