# res[i] = rotate_right(data[i], imm)   (bitwise rotate by a compile-time count)
primitive: ROR
input: [data, imm]
output: res
definitions:
  - isa: x86
    dtype: 'int{32, 64}'
    direct: '_mm{x86_widths}_ror_{dtype_suffix}(data, imm);'

  # clang folds (x >> imm) | (x << (n - imm)) to vprord/vprorq for a compile-time imm.
  - isa: clang_builtins
    dtype: 'int{32, 64}'
    signature: {data: '{v}', imm: imm32, res: '{v}'}
    direct: '({v})(({vuint})data >> imm | ({vuint})data << ({elem_bits} - imm));'

  - isa: tsl
    dtype: 'int{32, 64}'
    signature: {data: '{v}', imm: imm32, res: '{v}'}
    direct: 'tsl::binary_or<{simd_res}>(tsl::shift_right_imm<{simd_res}, imm, false>(data), tsl::shift_left_imm<{simd_res}, {elem_bits} - imm>(data));'
