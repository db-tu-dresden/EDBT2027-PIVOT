# res = (a[7:0] << 8) | b[7:0]
primitive: MASK_UNPACK
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm512_kunpackb(a, b);'

  - isa: clang_builtins
    signature: {a: v16b_bALL, b: v16b_bALL, res: v16b_bALL}
    direct: '__builtin_shufflevector(a, b, 16,17,18,19,20,21,22,23, 0,1,2,3,4,5,6,7);'

  - isa: clang_builtins
    dtype: bool8
    signature: {a: 'v8b_bALL', b: 'v8b_bALL', res: 'v16b_bALL'}
    direct: '__builtin_shufflevector(a, b, 8,9,10,11,12,13,14,15, 0,1,2,3,4,5,6,7);'

  - isa: tsl
    signature: {a: v16b_bALL, b: v16b_bALL, res: v16b_bALL}
    direct: 'tsl::to_mask<{simd_res}>((uint16_t)(((tsl::to_integral<{simd_a}>(a) & 0xFF) << 8) | (tsl::to_integral<{simd_b}>(b) & 0xFF)));'

  - isa: tsl
    signature: {a: v8b_bALL, b: v8b_bALL, res: v16b_bALL}
    direct: 'tsl::to_mask<{simd_res}>((uint16_t)(((uint16_t)tsl::to_integral<{simd_a}>(a) << 8) | (uint16_t)tsl::to_integral<{simd_b}>(b)));'
