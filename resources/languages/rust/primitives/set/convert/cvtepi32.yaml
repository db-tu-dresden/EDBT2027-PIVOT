primitive: CVTEPI32
input: [a]
output: res
definitions:

  # x86
  - isa: x86
    dtype: 'int{8, 16, 64}'
    direct: '_mm{x86_widths}_cvtepi32_{dtype_suffix}(a);'

  # Clang
  - isa: clang_builtins
    dtype: 'int64'
    signature: {a: 'v8i', res: 'v8l'}
    direct: '__builtin_convertvector((v8i)a, v8l);'

  - isa: clang_builtins
    dtype: 'int16'
    signature: {a: 'v16i', res: 'v16s'}
    direct: '__builtin_convertvector((v16i)a, v16s);'

  - isa: clang_builtins
    dtype: 'int8'
    signature: {a: 'v16i', res: 'v16c'}
    direct: '__builtin_convertvector((v16i)a, v16c);'

  # core_simd — Simd::cast is elementwise `as`: it sign-extends the source element.  The
  # result type is inferred from the helper's return type.
  - isa: core_simd
    dtype: 'int64'
    signature: {a: 'v8i', res: 'v8l'}
    direct: 'a.cast();'

  # core_simd — Simd::cast is elementwise `as`: it truncates the source element.  The
  # result type is inferred from the helper's return type.
  - isa: core_simd
    dtype: 'int16'
    signature: {a: 'v16i', res: 'v16s'}
    direct: 'a.cast();'

  # core_simd — Simd::cast is elementwise `as`: it truncates the source element.  The
  # result type is inferred from the helper's return type.
  - isa: core_simd
    dtype: 'int8'
    signature: {a: 'v16i', res: 'v16c'}
    direct: 'a.cast();'
