      for (int _i = 0; _i < 4; _i++) { long long _v = data[_i]; __r[_i] = _v < 0 ? 0 : (_v > 255 ? 255 : _v); }
      return __r;
  - isa: clang_builtins
    signature: {data: 'v4i', res: 'v8us'}
    direct: |-
      v8us __r = {0};
      for (int _i = 0; _i < 4; _i++) { long long _v = data[_i]; __r[_i] = _v < 0 ? 0 : (_v > 65535 ? 65535 : _v); }
      return __r;
  - isa: clang_builtins
