# res = a ^ b
primitive: XOR
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_xor_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'veor{neon_widths}_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'sveor_{dtype_suffix}_{sve_gov}(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a ^ b;'

  - isa: tsl
    dtype: '{int, uint}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::binary_xor<{simd_res}>(a, b);'

---
# res[i] = k[i] ? a[i] ^ b[i] : src[i]
primitive: XOR_MERGE
input: [src, k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_xor_{dtype_suffix}(src, k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'k ? (a ^ b) : src;'

  - isa: tsl
    dtype: '{int, uint}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::select<{simd_res}>(k, tsl::binary_xor<{simd_res}>(a, b), src);'

---
# res[i] = k[i] ? a[i] ^ b[i] : 0
primitive: XOR_ZERO
input: [k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_maskz_xor_{dtype_suffix}(k, a, b);'

  - isa: arm
    direct: 'sveor_{dtype_suffix}_z(k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'k ? (a ^ b) : ({v}){0};'

  - isa: tsl
    dtype: '{int, uint}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{v}'}
    direct: 'tsl::binary_xor_maskz<{simd_res}>(k, a, b);'
