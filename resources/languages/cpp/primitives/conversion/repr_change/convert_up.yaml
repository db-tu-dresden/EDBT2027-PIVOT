---
# res[i] = k[i] ? (widen) data[i] : src[i]
primitive: CONVERT_UP_MERGE
input: [src, k, data]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_cvtepu8_epi32(src, k, data);'

  - isa: clang_builtins
    signature: {src: 'v16i', k: 'v16b_i', data: 'v16uc', res: 'v16i'}
    direct: 'k ? __builtin_convertvector(data, v16i) : src;'
  - isa: clang_builtins
    signature: {src: 'v8i', k: 'v8b_i', data: 'v16uc', res: 'v8i'}
    direct: |-
      v16i __w = __builtin_convertvector(data, v16i);
      return k ? __builtin_shufflevector(__w, __w, 0,1,2,3,4,5,6,7) : src;
  - isa: clang_builtins
    signature: {src: 'v4i', k: 'v8b_i', data: 'v16uc', res: 'v4i'}
    direct: |-
      v16i __w = __builtin_convertvector(data, v16i);
      return __builtin_shufflevector(k, k, 0,1,2,3) ? __builtin_shufflevector(__w, __w, 0,1,2,3) : src;

  - isa: tsl
    signature: {src: 'v16i', k: 'v16b_i', data: 'v16uc', res: 'v16i', wide: '{data@res}'}
    direct: 'tsl::select<{simd_res}>(k, tsl::convert_up<{simd_wide}, {simd_res}, 0>(tsl::resize_up_undef<{simd_data}, {simd_wide}>(data)), src);'
  - isa: tsl
    signature: {src: 'v8i', k: 'v8b_i', data: 'v16uc', res: 'v8i', wide: '{data@res}'}
    direct: 'tsl::select<{simd_res}>(k, tsl::convert_up<{simd_wide}, {simd_res}, 0>(tsl::resize_up_undef<{simd_data}, {simd_wide}>(data)), src);'
  - isa: tsl
    signature: {src: 'v4i', k: 'v8b_i', data: 'v16uc', res: 'v4i'}
    direct: 'tsl::select<{simd_res}>(k, tsl::convert_up<{simd_data}, {simd_res}, 0>(data), src);'
