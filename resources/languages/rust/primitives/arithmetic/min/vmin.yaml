primitive: VMIN
input: [a, b]
output: res
definitions:
  - isa: x86
    dtype: '{int, uint, float}'
    direct: '_mm{x86_widths}_min_{dtype_suffix}(a, b);'

  # Neon
  - isa: arm
    dtype: 'float{16, 32, 64}'
    direct: vmin{neon_widths}_{dtype_suffix}(a, b);

  - isa: arm
    dtype: '{int, uint}{8, 16, 32}'
    direct: vmin{neon_widths}_{dtype_suffix}(a, b);

  - isa: arm
    dtype: '{int, uint, float}'
    direct: 'svmin_{dtype_suffix}_x(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a < b ? a : b;'

  # core_simd — SimdOrd::simd_min / SimdFloat::simd_min
  - isa: core_simd
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a.simd_min(b);'
