  - isa: tsl
    signature: {a: v16us, res: v32us}
    direct: 'tsl::resize_up_undef<{simd_a}, {simd_res}>(a);'
  - isa: tsl
    signature: {a: v8i, res: v16i}
    direct: 'tsl::resize_up_undef<{simd_a}, {simd_res}>(a);'
  - isa: tsl
    signature: {a: v8ui, res: v16ui}
    direct: 'tsl::resize_up_undef<{simd_a}, {simd_res}>(a);'
  - isa: tsl
    signature: {a: v4l, res: v8l}
    direct: 'tsl::resize_up_undef<{simd_a}, {simd_res}>(a);'
  - isa: tsl
    signature: {a: v4ul, res: v8ul}
    direct: 'tsl::resize_up_undef<{simd_a}, {simd_res}>(a);'

