# res = a > b
primitive: GT
input: [a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_cmpgt_{dtype_suffix}_mask(a, b);'

  - isa: x86
    dtype: float
    direct: '_mm{x86_widths}_cmp_{dtype_suffix}_mask(a, b, _CMP_GT_OQ);'

  - isa: arm
    direct: 'vcgt{neon_widths}_{dtype_suffix}(a, b);'

  - isa: arm
    direct: 'svcmpgt_{dtype_suffix}(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'a > b;'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'tsl::greater_than<{simd_a}>(a, b);'

---
# res = k ? (a > b) : 0
primitive: GT_ZERO
input: [k, a, b]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_cmpgt_{dtype_suffix}_mask(k, a, b);'

  - isa: x86
    dtype: float
    direct: '_mm{x86_widths}_mask_cmp_{dtype_suffix}_mask(k, a, b, _CMP_GT_OQ);'

  - isa: arm
    direct: 'svcmpgt_{dtype_suffix}(k, a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'k ? (a > b) : false;'

  - isa: tsl
    dtype: '{int, uint, float}'
    signature: {k: '{vbool}', a: '{v}', b: '{v}', res: '{vbool}'}
    direct: 'tsl::greater_than_maskz<{simd_a}>(k, a, b);'
