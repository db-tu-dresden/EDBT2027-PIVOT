# res = |a|
primitive: ABS
input: [a]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_abs_{dtype_suffix}(a);'

  - isa: arm
    direct: 'vabs{neon_widths}_{dtype_suffix}(a);'

  - isa: arm
    direct: 'svabs_{dtype_suffix}_{sve_gov}(svptrue_b{elem_bits}(), a);'

  - isa: clang_builtins
    dtype: '{int, float}'
    signature: {a: '{v}', res: '{v}'}
    direct: '__builtin_elementwise_abs(a);'

  - isa: tsl
    dtype: '{int, float}'
    signature: {a: '{v}', res: '{v}'}
    direct: 'tsl::abs<{simd_res}>(a);'

---
# res = k ? |a| : src
primitive: ABS_MERGE
input: [src, k, a]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_mask_abs_{dtype_suffix}(src, k, a);'

  - isa: arm
    direct: 'svabs_{dtype_suffix}_m(src, k, a);'

  - isa: clang_builtins
    dtype: '{int, float}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', res: '{v}'}
    direct: 'k ? __builtin_elementwise_abs(a) : src;'

  - isa: tsl
    dtype: '{int, float}'
    signature: {src: '{v}', k: '{vbool}', a: '{v}', res: '{v}'}
    direct: 'tsl::select<{simd_res}>(k, tsl::abs<{simd_res}>(a), src);'

---
# res = k ? |a| : 0
primitive: ABS_ZERO
input: [k, a]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_maskz_abs_{dtype_suffix}(k, a);'

  - isa: arm
    direct: 'svabs_{dtype_suffix}_z(k, a);'

  - isa: clang_builtins
    dtype: '{int, float}'
    signature: {k: '{vbool}', a: '{v}', res: '{v}'}
    direct: 'k ? __builtin_elementwise_abs(a) : ({v}){0};'

  - isa: tsl
    dtype: '{int, float}'
    signature: {k: '{vbool}', a: '{v}', res: '{v}'}
    direct: 'tsl::mov_maskz<{simd_res}>(k, tsl::abs<{simd_res}>(a));'
