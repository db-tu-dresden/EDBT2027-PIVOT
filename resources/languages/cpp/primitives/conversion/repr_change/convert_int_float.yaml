# res[i] = k[i] ? (float) a[i] : 0
primitive: CONVERT_INT_TO_FLOAT_ZERO
input: [k, a]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_maskz_cvtepi32_ps(k, a);'
  - isa: x86
    direct: '_mm{x86_widths}_maskz_cvtepu32_ps(k, a);'
  - isa: x86
    direct: '_mm{x86_widths}_maskz_cvtepi64_pd(k, a);'
  - isa: x86
    direct: '_mm{x86_widths}_maskz_cvtepu64_pd(k, a);'

  - isa: arm
    direct: 'svcvt_f32_s32_z(k, a);'
  - isa: arm
    direct: 'svcvt_f32_u32_z(k, a);'
  - isa: arm
    direct: 'svcvt_f64_s64_z(k, a);'
  - isa: arm
    direct: 'svcvt_f64_u64_z(k, a);'

  - isa: clang_builtins
    signature: {k: v4b_f, a: v4i, res: v4f}
    direct: 'k ? __builtin_convertvector(a, v4f) : (v4f){0};'
  - isa: clang_builtins
    signature: {k: v8b_f, a: v8i, res: v8f}
    direct: 'k ? __builtin_convertvector(a, v8f) : (v8f){0};'
  - isa: clang_builtins
