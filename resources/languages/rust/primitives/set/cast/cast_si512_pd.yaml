primitive: CAST_SI512_PD
input: [a]   # res := reinterpret 512-bit integer register as float64
output: res
definitions:

  # x86
  - isa: x86
    direct: '_mm512_castsi512_pd(a);'

  # Clang
  - isa: clang_builtins
    signature: {a: v8l, res: v8d}
    direct: '(v8d)a;'

  # core_simd — same-size bit reinterpret
  - isa: core_simd
    signature: {a: v8l, res: v8d}
    direct: 'unsafe { core::mem::transmute::<{simd_a}, {simd_res}>(a) };'
