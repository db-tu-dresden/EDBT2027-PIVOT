# res = register width in bytes
primitive: LANE_COUNT_8
input: []
output: res
definitions:
  - isa: arm
    direct: 'svcntb();'

  - isa: clang_builtins
    signature: {res: uint64_t}
    direct: 'PIVOT_CB_VLEN_BITS / 8;'

  - isa: tsl
    signature: {res: uint64_t, elem: vc}
    direct: '{simd_elem}::vector_element_count;'

