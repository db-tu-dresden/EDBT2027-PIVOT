primitive: VSUB
input: [a, b]
output: res
definitions:
  - 'isa': 'x86'
    'dtype': '{int, float}'
    'direct': '_mm{x86_widths}_sub_{dtype_suffix}(a, b);'

  - isa: arm
    dtype: '{int, uint, float}'
    direct: 'vsub{neon_widths}_{dtype_suffix}(a, b);'

  - isa: arm
    dtype: '{int, uint, float}'
    direct: 'svsub_{dtype_suffix}_x(svptrue_b{elem_bits}(), a, b);'

  - isa: clang_builtins
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a - b;'

  # core_simd — elementwise operator
  - isa: core_simd
    dtype: '{int, uint, float}'
    signature: {a: '{v}', b: '{v}', res: '{v}'}
    direct: 'a - b;'
