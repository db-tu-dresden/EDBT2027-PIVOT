      for (int _i = 0; _i < 2; _i++) { long long _v = data[_i]; __r[_i] = _v < -128 ? -128 : (_v > 127 ? 127 : _v); }
      return __r;
  - isa: clang_builtins
    signature: {data: 'v2l', res: 'v4i'}
