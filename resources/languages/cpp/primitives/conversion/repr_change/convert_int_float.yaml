  - isa: clang_builtins
    signature: {k: v8b_f, a: v8ui, res: v8f}
    direct: 'k ? __builtin_convertvector(a, v8f) : (v8f){0};'
  - isa: clang_builtins
    signature: {k: v16b_f, a: v16ui, res: v16f}
    direct: 'k ? __builtin_convertvector(a, v16f) : (v16f){0};'
  - isa: clang_builtins
    signature: {k: v2b_d, a: v2l, res: v2d}
