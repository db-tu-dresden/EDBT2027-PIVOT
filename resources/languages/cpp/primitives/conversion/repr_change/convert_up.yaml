# res[i] = (widen) data[i]   (low lanes, zero/sign-extended)
primitive: CONVERT_UP
input: [data]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_cvtepu8_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepu16_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepu32_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepi8_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepi16_epi32(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepi16_epi64(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtepi32_epi64(data);'

  - isa: clang_builtins
    signature: {data: 'v16c', res: 'v2l'}
    direct: '__builtin_convertvector(__builtin_shufflevector((v16c)data, (v16c)data, 0, 1), v2l);'
  - isa: clang_builtins
    signature: {data: 'v16uc', res: 'v2l'}
    direct: '__builtin_convertvector(__builtin_shufflevector((v16uc)data, (v16uc)data, 0, 1), v2l);'
  - isa: clang_builtins
