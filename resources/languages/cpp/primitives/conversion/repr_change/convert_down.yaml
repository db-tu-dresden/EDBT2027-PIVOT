# res[i] = signed-saturate narrow of data[i]  (low lanes packed, upper zero)
primitive: CONVERT_DOWN
input: [data]
output: res
definitions:
  - isa: x86
    direct: '_mm{x86_widths}_cvtsepi16_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtsepi32_{dtype_suffix}(data);'
  - isa: x86
    direct: '_mm{x86_widths}_cvtsepi64_{dtype_suffix}(data);'

  - isa: clang_builtins
    signature: {data: 'v8s', res: 'v16c'}
    direct: |-
      v16c __r = {0};
      for (int _i = 0; _i < 8; _i++) { long long _v = data[_i]; __r[_i] = _v < -128 ? -128 : (_v > 127 ? 127 : _v); }
      return __r;
  - isa: clang_builtins
    signature: {data: 'v16s', res: 'v16c'}
    direct: 'return __builtin_convertvector(__builtin_elementwise_min(__builtin_elementwise_max(data, (v16s)(-128)), (v16s)127), v16c);'
  - isa: clang_builtins
    signature: {data: 'v32s', res: 'v32c'}
    direct: 'return __builtin_convertvector(__builtin_elementwise_min(__builtin_elementwise_max(data, (v32s)(-128)), (v32s)127), v32c);'
  - isa: clang_builtins
    signature: {data: 'v4i', res: 'v16c'}
